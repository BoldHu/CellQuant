[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellquant-research-kit"
version = "0.1.0"
description = "Reproducible research scaffold for bilateral orthogonal quantization calibration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
notebook = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6", "pandas>=2", "matplotlib>=3.7"]
test = ["pytest>=7"]
dev = ["pytest>=7", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6", "pandas>=2", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
